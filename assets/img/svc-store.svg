<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Warehouse racking with pallets and numbered tamper-proof bait stations along the walls and loading door">
  <title>Store Shield — mapped bait station network in a warehouse</title>
  <rect width="640" height="440" fill="#F2F5F8"/>

  <!-- roof trusses -->
  <g fill="none" stroke="#DDE2E8" stroke-width="2">
    <path d="M20 96 L320 32 L620 96"/>
    <path d="M20 96 L620 96"/>
    <path d="M170 64 L170 96 M320 32 L320 96 M470 64 L470 96"/>
  </g>

  <line x1="0" y1="352" x2="640" y2="352" stroke="#091123" stroke-width="2"/>

  <!-- racking bay 1 -->
  <g stroke="#091123" stroke-width="2" fill="none">
    <rect x="46" y="140" width="150" height="212"/>
    <line x1="46" y1="208" x2="196" y2="208"/>
    <line x1="46" y1="278" x2="196" y2="278"/>
  </g>
  <g fill="#DDE2E8" stroke="#586475" stroke-width="1.3">
    <rect x="58" y="164" width="58" height="42"/><rect x="124" y="164" width="60" height="42"/>
    <rect x="58" y="234" width="58" height="42"/><rect x="124" y="236" width="60" height="40"/>
    <rect x="58" y="304" width="126" height="46"/>
  </g>

  <!-- racking bay 2 -->
  <g stroke="#091123" stroke-width="2" fill="none">
    <rect x="234" y="140" width="150" height="212"/>
    <line x1="234" y1="208" x2="384" y2="208"/>
    <line x1="234" y1="278" x2="384" y2="278"/>
  </g>
  <g fill="#DDE2E8" stroke="#586475" stroke-width="1.3">
    <rect x="246" y="166" width="60" height="40"/><rect x="312" y="164" width="60" height="42"/>
    <rect x="246" y="236" width="126" height="40"/>
    <rect x="246" y="302" width="58" height="48"/><rect x="312" y="306" width="60" height="44"/>
  </g>

  <!-- grain sacks (stored product insects) -->
  <g fill="#FDF2E4" stroke="#D37300" stroke-width="1.6">
    <path d="M424 300 q14 -22 30 0 v50 h-30 z"/>
    <path d="M462 306 q13 -20 28 0 v44 h-28 z"/>
  </g>
  <text x="418" y="292" font-family="JetBrains Mono, monospace" font-size="9" fill="#D37300" letter-spacing="1">SPI TRAPS</text>

  <!-- roller shutter loading door -->
  <rect x="524" y="176" width="92" height="176" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
  <g stroke="#091123" stroke-width="1.2">
    <line x1="524" y1="204" x2="616" y2="204"/><line x1="524" y1="232" x2="616" y2="232"/>
    <line x1="524" y1="260" x2="616" y2="260"/><line x1="524" y1="288" x2="616" y2="288"/>
    <line x1="524" y1="316" x2="616" y2="316"/>
  </g>
  <text x="524" y="168" font-family="JetBrains Mono, monospace" font-size="9" fill="#586475" letter-spacing="1">LOADING DOOR</text>
  <!-- gap under door flagged -->
  <rect x="524" y="344" width="92" height="8" fill="#FDF2E4" stroke="#D37300" stroke-width="1.6" stroke-dasharray="4 3"/>

  <!-- numbered tamper-proof stations along skirting -->
  <g font-family="JetBrains Mono, monospace" font-size="10" font-weight="500">
    <g><rect x="14" y="332" width="24" height="20" rx="3" fill="#173796"/><text x="26" y="346" text-anchor="middle" fill="#FFFFFF">01</text></g>
    <g><rect x="204" y="332" width="24" height="20" rx="3" fill="#173796"/><text x="216" y="346" text-anchor="middle" fill="#FFFFFF">02</text></g>
    <g><rect x="392" y="332" width="24" height="20" rx="3" fill="#173796"/><text x="404" y="346" text-anchor="middle" fill="#FFFFFF">03</text></g>
    <g><rect x="494" y="332" width="24" height="20" rx="3" fill="#D37300"/><text x="506" y="346" text-anchor="middle" fill="#FFFFFF">04</text></g>
  </g>

  <!-- trend clipboard -->
  <g>
    <rect x="428" y="140" width="112" height="82" rx="3" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
    <rect x="466" y="132" width="36" height="12" rx="3" fill="#586475"/>
    <polyline points="442,204 464,190 486,196 508,172 528,164" fill="none" stroke="#173796" stroke-width="2.4"/>
    <g fill="#173796"><circle cx="442" cy="204" r="2.6"/><circle cx="464" cy="190" r="2.6"/><circle cx="486" cy="196" r="2.6"/><circle cx="508" cy="172" r="2.6"/><circle cx="528" cy="164" r="2.6"/></g>
    <text x="440" y="160" font-family="JetBrains Mono, monospace" font-size="8" fill="#586475" letter-spacing="1">TREND ↓</text>
  </g>

  <rect x="0" y="398" width="640" height="42" fill="#173796"/>
  <text x="24" y="424" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" letter-spacing="1.4">MAPPED STATIONS · MONTHLY INTEGRITY CHECK · TREND REPORT</text>
</svg>

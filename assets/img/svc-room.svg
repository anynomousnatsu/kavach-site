<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Guest room bed with mattress seams, headboard joints and skirting marked as bed bug inspection points">
  <title>Room Shield — quarterly guest room bed bug inspection</title>
  <rect width="640" height="440" fill="#F2F5F8"/>

  <!-- wall / skirting -->
  <line x1="0" y1="330" x2="640" y2="330" stroke="#091123" stroke-width="2"/>
  <rect x="0" y="330" width="640" height="14" fill="#DDE2E8"/>
  <line x1="0" y1="344" x2="640" y2="344" stroke="#091123" stroke-width="1.4"/>

  <!-- door number plate -->
  <rect x="516" y="60" width="92" height="52" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
  <text x="562" y="86" text-anchor="middle" font-family="Inter Tight, sans-serif" font-size="20" font-weight="800" fill="#091123">203</text>
  <text x="562" y="103" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="#586475" letter-spacing="1">VERIFIED</text>

  <!-- headboard -->
  <rect x="150" y="120" width="270" height="96" rx="4" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
  <line x1="150" y1="152" x2="420" y2="152" stroke="#091123" stroke-width="1.2"/>
  <line x1="150" y1="184" x2="420" y2="184" stroke="#091123" stroke-width="1.2"/>
  <line x1="240" y1="120" x2="240" y2="216" stroke="#091123" stroke-width="1.2"/>
  <line x1="330" y1="120" x2="330" y2="216" stroke="#091123" stroke-width="1.2"/>
  <text x="158" y="138" font-family="JetBrains Mono, monospace" font-size="9" fill="#586475" letter-spacing="1">HEADBOARD JOINTS</text>

  <!-- mattress -->
  <rect x="140" y="216" width="290" height="52" rx="6" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
  <!-- highlighted seam -->
  <line x1="140" y1="242" x2="430" y2="242" stroke="#D37300" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="150" y="234" font-family="JetBrains Mono, monospace" font-size="9" fill="#D37300" letter-spacing="1">MATTRESS SEAM</text>

  <!-- base / frame -->
  <rect x="146" y="268" width="278" height="40" fill="#DDE2E8" stroke="#091123" stroke-width="2"/>
  <line x1="146" y1="288" x2="424" y2="288" stroke="#091123" stroke-width="1.2"/>
  <!-- legs -->
  <rect x="156" y="308" width="12" height="22" fill="#091123"/>
  <rect x="402" y="308" width="12" height="22" fill="#091123"/>

  <!-- pillows -->
  <rect x="168" y="196" width="98" height="26" rx="10" fill="#F7FAFD" stroke="#091123" stroke-width="1.6"/>
  <rect x="300" y="196" width="98" height="26" rx="10" fill="#F7FAFD" stroke="#091123" stroke-width="1.6"/>

  <!-- bedside table -->
  <rect x="452" y="240" width="76" height="90" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
  <line x1="452" y1="272" x2="528" y2="272" stroke="#091123" stroke-width="1.2"/>
  <circle cx="490" cy="256" r="3" fill="#586475"/>
  <!-- lamp -->
  <path d="M474 216 L506 216 L498 240 L482 240 Z" fill="#FDF2E4" stroke="#091123" stroke-width="1.6"/>

  <!-- steam wand (the differentiator) -->
  <g>
    <rect x="52" y="196" width="18" height="104" rx="4" fill="#173796"/>
    <rect x="44" y="182" width="34" height="18" rx="4" fill="#091123"/>
    <path d="M78 190 q26 -10 44 4" fill="none" stroke="#586475" stroke-width="2" stroke-linecap="round"/>
    <g fill="none" stroke="#D37300" stroke-width="2" stroke-linecap="round" opacity=".85">
      <path d="M124 190 q12 -8 22 -2"/>
      <path d="M126 200 q14 -6 24 0"/>
      <path d="M124 210 q12 4 24 0"/>
    </g>
    <text x="34" y="318" font-family="JetBrains Mono, monospace" font-size="9" fill="#586475" letter-spacing="1">STEAM</text>
  </g>

  <!-- inspection markers -->
  <g font-family="JetBrains Mono, monospace" font-size="11" font-weight="500">
    <g><circle cx="196" cy="242" r="13" fill="#D37300"/><text x="196" y="246" text-anchor="middle" fill="#FFFFFF">1</text></g>
    <g><circle cx="286" cy="152" r="13" fill="#173796"/><text x="286" y="156" text-anchor="middle" fill="#FFFFFF">2</text></g>
    <g><circle cx="386" cy="288" r="13" fill="#173796"/><text x="386" y="292" text-anchor="middle" fill="#FFFFFF">3</text></g>
    <g><circle cx="580" cy="337" r="13" fill="#173796"/><text x="580" y="341" text-anchor="middle" fill="#FFFFFF">4</text></g>
  </g>
  <text x="452" y="368" font-family="JetBrains Mono, monospace" font-size="9" fill="#586475" letter-spacing="1">SKIRTING</text>

  <rect x="0" y="398" width="640" height="42" fill="#173796"/>
  <text x="24" y="424" font-family="JetBrains Mono, monospace" font-size="11" fill="#FFFFFF" letter-spacing="1.4">EVERY ROOM · EVERY QUARTER · PER-ROOM RECORD CARD</text>
</svg>

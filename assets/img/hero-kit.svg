<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" role="img" aria-label="The kit a Kavach technician carries: an open service logbook, respirator, gloves, torch and applicator">
  <title>The evidentiary kit — logbook, respirator, gloves, torch, applicator</title>
  <rect width="560" height="660" fill="#F2F5F8"/>
  <!-- surface -->
  <rect x="0" y="0" width="560" height="660" fill="#F7FAFD"/>
  <g stroke="#E7ECF2" stroke-width="1">
    <line x1="0" y1="150" x2="560" y2="150"/><line x1="0" y1="330" x2="560" y2="330"/><line x1="0" y1="510" x2="560" y2="510"/>
  </g>

  <!-- ================= OPEN LOGBOOK ================= -->
  <g>
    <!-- shadow plate -->
    <rect x="46" y="52" width="470" height="272" rx="4" fill="#DDE2E8"/>
    <!-- left page -->
    <rect x="40" y="44" width="234" height="272" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
    <!-- right page -->
    <rect x="274" y="44" width="234" height="272" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
    <!-- spine -->
    <rect x="266" y="44" width="16" height="272" fill="#173796"/>
    <g stroke="#FFFFFF" stroke-width="1" opacity=".45">
      <line x1="270" y1="70" x2="278" y2="70"/><line x1="270" y1="110" x2="278" y2="110"/>
      <line x1="270" y1="150" x2="278" y2="150"/><line x1="270" y1="190" x2="278" y2="190"/>
      <line x1="270" y1="230" x2="278" y2="230"/><line x1="270" y1="270" x2="278" y2="270"/>
    </g>

    <!-- left page header -->
    <rect x="40" y="44" width="234" height="34" fill="#173796"/>
    <text x="54" y="66" font-family="Inter Tight, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.6">KAVACH · LOGBOOK</text>
    <!-- left page ruled entries -->
    <g font-family="JetBrains Mono, monospace" font-size="8" fill="#586475">
      <text x="54" y="96" letter-spacing="1">DATE</text><text x="132" y="96" letter-spacing="1">IN/OUT</text><text x="216" y="96" letter-spacing="1">TECH</text>
    </g>
    <line x1="54" y1="102" x2="260" y2="102" stroke="#DDE2E8"/>
    <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#091123">
      <text x="54" y="120">07-12</text><text x="132" y="120">23:30-01:20</text><text x="216" y="120">RT</text>
      <text x="54" y="142">06-14</text><text x="132" y="142">23:40-01:35</text><text x="216" y="142">RT</text>
      <text x="54" y="164">05-10</text><text x="132" y="164">23:25-01:10</text><text x="216" y="164">RT</text>
      <text x="54" y="186">04-12</text><text x="132" y="186">23:35-01:30</text><text x="216" y="186">RT</text>
    </g>
    <g stroke="#EEF1F5"><line x1="54" y1="128" x2="260" y2="128"/><line x1="54" y1="150" x2="260" y2="150"/><line x1="54" y1="172" x2="260" y2="172"/></g>
    <!-- status chips -->
    <g font-family="JetBrains Mono, monospace" font-size="7">
      <rect x="54" y="200" width="42" height="14" rx="2" fill="#E7F2EC"/><text x="60" y="210" fill="#1F6B4A">CLEAR</text>
      <rect x="102" y="200" width="54" height="14" rx="2" fill="#FDF2E4"/><text x="108" y="210" fill="#D37300">ACTIVITY</text>
    </g>
    <!-- signature block -->
    <line x1="54" y1="272" x2="176" y2="272" stroke="#091123"/>
    <text x="54" y="288" font-family="JetBrains Mono, monospace" font-size="7" fill="#586475" letter-spacing="1">TECHNICIAN SIGN</text>
    <path d="M62 266 q14 -12 24 0 t22 -6" fill="none" stroke="#173796" stroke-width="1.6" stroke-linecap="round"/>

    <!-- right page: batch numbers -->
    <text x="292" y="70" font-family="JetBrains Mono, monospace" font-size="8" fill="#173796" letter-spacing="1.2">PRODUCTS · BATCH TRACEABLE</text>
    <line x1="292" y1="78" x2="492" y2="78" stroke="#DDE2E8"/>
    <g font-family="JetBrains Mono, monospace" font-size="8" fill="#2A3446">
      <text x="292" y="98">Fipronil gel</text><text x="410" y="98" fill="#091123">FG-2604-118</text>
      <text x="292" y="120">Imidacloprid</text><text x="410" y="120" fill="#091123">IM-2603-077</text>
      <text x="292" y="142">Drain foam</text><text x="410" y="142" fill="#091123">DF-2606-021</text>
      <text x="292" y="164">Bromadiolone</text><text x="410" y="164" fill="#091123">BR-2601-431</text>
    </g>
    <g stroke="#EEF1F5"><line x1="292" y1="106" x2="492" y2="106"/><line x1="292" y1="128" x2="492" y2="128"/><line x1="292" y1="150" x2="492" y2="150"/></g>
    <!-- mini station map -->
    <text x="292" y="192" font-family="JetBrains Mono, monospace" font-size="8" fill="#173796" letter-spacing="1.2">STATION MAP</text>
    <rect x="292" y="200" width="200" height="86" fill="#F7FAFD" stroke="#DDE2E8" stroke-width="1.4"/>
    <line x1="380" y1="200" x2="380" y2="286" stroke="#DDE2E8"/>
    <line x1="292" y1="248" x2="492" y2="248" stroke="#DDE2E8"/>
    <g font-family="JetBrains Mono, monospace" font-size="7" fill="#FFFFFF">
      <circle cx="320" cy="222" r="8" fill="#173796"/><text x="320" y="225" text-anchor="middle">1</text>
      <circle cx="356" cy="266" r="8" fill="#173796"/><text x="356" y="269" text-anchor="middle">2</text>
      <circle cx="420" cy="222" r="8" fill="#D37300"/><text x="420" y="225" text-anchor="middle">3</text>
      <circle cx="466" cy="266" r="8" fill="#173796"/><text x="466" y="269" text-anchor="middle">4</text>
    </g>
  </g>

  <!-- ================= RESPIRATOR ================= -->
  <g transform="translate(52 356)">
    <path d="M8 34 q56 -40 112 0 q6 42 -20 62 q-36 20 -72 0 q-26 -20 -20 -62 Z" fill="#FFFFFF" stroke="#091123" stroke-width="2.2"/>
    <!-- straps -->
    <path d="M8 42 q-30 6 -34 30" fill="none" stroke="#586475" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M120 42 q30 6 34 30" fill="none" stroke="#586475" stroke-width="2.4" stroke-linecap="round"/>
    <!-- filter cartridges -->
    <circle cx="26" cy="66" r="17" fill="#173796" stroke="#091123" stroke-width="2"/>
    <circle cx="102" cy="66" r="17" fill="#173796" stroke="#091123" stroke-width="2"/>
    <g stroke="#FFFFFF" stroke-width="1.4" opacity=".7">
      <line x1="18" y1="62" x2="34" y2="62"/><line x1="18" y1="70" x2="34" y2="70"/>
      <line x1="94" y1="62" x2="110" y2="62"/><line x1="94" y1="70" x2="110" y2="70"/>
    </g>
    <!-- exhale valve -->
    <ellipse cx="64" cy="82" rx="13" ry="9" fill="#DDE2E8" stroke="#091123" stroke-width="1.8"/>
    <text x="0" y="122" font-family="JetBrains Mono, monospace" font-size="8" fill="#586475" letter-spacing="1.2">RESPIRATOR</text>
  </g>

  <!-- ================= GLOVES ================= -->
  <g transform="translate(232 366)">
    <!-- glove 1 -->
    <path d="M20 96 v-46 q0 -12 11 -12 t11 12 v-6 q0 -13 11 -13 t11 13 v4 q0 -12 11 -12 t11 12 v10 q9 -2 12 6 q4 12 -6 20 l-22 20 q-8 8 -20 8 h-19 q-11 0 -11 -12 Z"
          fill="#173796" stroke="#091123" stroke-width="2"/>
    <rect x="18" y="94" width="60" height="16" rx="4" fill="#0E2C7A" stroke="#091123" stroke-width="2"/>
    <!-- glove 2 behind -->
    <path d="M88 104 v-40 q0 -11 10 -11 t10 11 v-5 q0 -12 10 -12 t10 12 v3 q0 -11 10 -11 t10 11 v9 q8 -2 11 5 q4 11 -5 18 l-20 18 q-8 7 -18 7 h-18 q-10 0 -10 -11 Z"
          fill="#2B4FB5" stroke="#091123" stroke-width="2" opacity=".95"/>
    <rect x="86" y="102" width="56" height="15" rx="4" fill="#173796" stroke="#091123" stroke-width="2"/>
    <text x="14" y="132" font-family="JetBrains Mono, monospace" font-size="8" fill="#586475" letter-spacing="1.2">NITRILE GLOVES</text>
  </g>

  <!-- ================= TORCH ================= -->
  <g transform="translate(48 528)">
    <rect x="0" y="24" width="112" height="26" rx="5" fill="#091123"/>
    <rect x="14" y="28" width="26" height="18" rx="3" fill="#2A3446"/>
    <path d="M112 18 l30 -8 v58 l-30 -8 Z" fill="#173796" stroke="#091123" stroke-width="2"/>
    <rect x="140" y="14" width="8" height="46" rx="2" fill="#DDE2E8" stroke="#091123" stroke-width="1.6"/>
    <!-- beam -->
    <path d="M150 22 L228 4 L228 70 L150 52 Z" fill="#FDF2E4" opacity=".85"/>
    <path d="M150 30 L206 18 L206 56 L150 44 Z" fill="#FFE9C6" opacity=".9"/>
    <text x="0" y="72" font-family="JetBrains Mono, monospace" font-size="8" fill="#586475" letter-spacing="1.2">INSPECTION TORCH</text>
  </g>

  <!-- ================= APPLICATOR / GEL SYRINGE ================= -->
  <g transform="translate(320 524)">
    <rect x="0" y="26" width="118" height="20" rx="4" fill="#FFFFFF" stroke="#091123" stroke-width="2"/>
    <rect x="6" y="30" width="70" height="12" rx="2" fill="#FDF2E4"/>
    <rect x="-22" y="28" width="24" height="16" rx="3" fill="#586475"/>
    <path d="M118 30 l30 4 l-30 4 Z" fill="#091123"/>
    <path d="M148 33 l14 1 l-14 1 Z" fill="#D37300"/>
    <circle cx="164" cy="34" r="3" fill="#D37300"/>
    <text x="-20" y="70" font-family="JetBrains Mono, monospace" font-size="8" fill="#586475" letter-spacing="1.2">GEL APPLICATOR</text>
  </g>

  <!-- caption band -->
  <rect x="0" y="618" width="560" height="42" fill="#173796"/>
  <text x="24" y="644" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#FFFFFF" letter-spacing="1.3">WHAT WE CARRY TO EVERY VISIT</text>
</svg>
